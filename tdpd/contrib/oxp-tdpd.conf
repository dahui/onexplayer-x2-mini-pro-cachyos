# oxp-tdpd configuration. Installed to /etc/oxp-tdpd.conf.
# Restart the daemon after editing: sudo systemctl restart oxp-tdpd

# Which power limits a single slider value drives.
#
#   all       Set STAPM, PPT fast and PPT slow all to the slider value.
#             The slider becomes a real ceiling. Default.
#
#   stapm     Set only the sustained (STAPM) limit and restore fast/slow to the
#             firmware defaults captured on first run, preserving stock burst
#             behaviour.
#
#   headroom  STAPM and slow at the slider, fast 25% above (capped at 85 W).
#             Bounds sustained power while keeping some burst responsiveness.
#
# Measured on this device at a 45 W setting, all-core load:
#
#   all       45 W flat, 74 C
#   stapm     72-79 W, 90-95 C   <- STAPM's time constant is minutes-scale, so
#                                   it does not bound mid-range settings in any
#                                   useful window
#
# "all" is the default because a slider labelled 45 W that draws 79 W is
# surprising. Switch to "stapm" if you would rather have the stock burst
# behaviour and treat the slider as a target to settle towards.

policy = "all"
