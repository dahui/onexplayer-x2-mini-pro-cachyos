<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus policy for oxp-tdpd.

  Only root may own the name. Sending is allowed from the default context
  because it is steamos-manager's *user* daemon that proxies TdpLimit1 to us,
  not its root daemon — restricting sends to root makes that daemon exit at
  startup with "AccessDenied: Sender is not authorized to send message".

  Write access is therefore as broad as steamos-manager's own session-facing
  TDP interface, which is the effective boundary anyway: anything that can talk
  to steamos-manager can already set the TDP limit.

  Installed to /usr/share/dbus-1/system.d/.
-->
<busconfig>
  <policy user="root">
    <allow own="io.aletheia.OxpTdp1"/>
  </policy>

  <policy context="default">
    <!-- zbus pings the remote for liveness before using it. Omitting this
         interface makes steamos-manager's user daemon fail at startup with
         "AccessDenied: Sender is not authorized to send message", which reads
         as a bug in the daemon rather than a policy gap. -->
    <allow send_destination="io.aletheia.OxpTdp1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.aletheia.OxpTdp1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.aletheia.OxpTdp1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.aletheia.OxpTdp1"
           send_interface="com.steampowered.SteamOSManager1.TdpLimit1"/>
  </policy>
</busconfig>
