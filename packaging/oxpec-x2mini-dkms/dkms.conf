# Consumed by the PKGBUILD next to this file.
#
# PACKAGE_NAME is deliberately distinct from upstream oxpec, but BUILT_MODULE_NAME
# must stay "oxpec": that is what binds the hardware and what modprobe and the
# shipped configs reference. DEST_MODULE_LOCATION=/updates is what makes it take
# precedence over the in-tree module.
PACKAGE_NAME="oxpec-x2mini"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="oxpec"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"
