name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tdpd/go.mod
          cache-dependency-path: tdpd/go.sum

      - name: Build oxp-tdpd
        working-directory: tdpd
        env:
          # Static, so the binary does not depend on the build host's libc. The
          # daemon only touches sysfs and D-Bus, so it needs nothing from cgo.
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ../dist/oxp-tdpd .
          file ../dist/oxp-tdpd

      - name: Create source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Match the layout GitHub's own archive produces, so the PKGBUILDs
          # work against either.
          git archive --format=tar.gz \
            --prefix="onexplayer-x2-mini-pro-cachyos-${VERSION}/" \
            -o "dist/onexplayer-x2-mini-pro-cachyos-${VERSION}.tar.gz" \
            "${GITHUB_REF_NAME}"

      - name: Build DKMS packages
        # In a container rather than a container-job, so the Go steps above keep
        # using the normal runner. Both packages are arch=any and ship source
        # only -- the user's machine compiles the module -- so a package built
        # here is portable to any Arch install.
        #
        # ryzen-smu-x2mini-dkms is shipped here rather than on the AUR because it
        # forks an existing AUR package and is meant to be deleted once its patch
        # is upstreamed. The release page keeps it out of that namespace.
        #
        # Build in a container-local copy, NOT in the bind mount. `chown -R` on
        # /work would hand the runner's whole workspace to the container UID and
        # leave later steps unable to write there -- which is exactly how the
        # first v0.1.0 attempt died, on "SHA256SUMS: Permission denied".
        run: |
          docker run --rm -v "$PWD:/work" archlinux:base-devel bash -c '
            set -euo pipefail
            pacman -Syu --noconfirm --needed git
            useradd -m builder
            cp -a /work /build
            chown -R builder /build
            for p in oxpec-x2mini-dkms ryzen-smu-x2mini-dkms; do
              runuser -u builder -- bash -c "cd /build/packaging/$p && makepkg -f --nodeps --noconfirm"
              cp /build/packaging/$p/*.pkg.tar.zst /work/dist/
            done
          '
          # Artifacts land root-owned from the container; hand them back.
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist/

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oxp-tdpd
            dist/*.pkg.tar.zst
            dist/onexplayer-x2-mini-pro-cachyos-*.tar.gz
            dist/SHA256SUMS
          body: |
            ## Install

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd onexplayer-x2-mini-pro-cachyos
            ./install.sh
            ```

            `oxp-tdpd` below is statically linked and built from this tag by CI.
            Verify it against `SHA256SUMS` before use.

            **Suspend needs a kernel parameter** that this installer will not set
            for you: `amd_iommu=off mem_sleep_default=s2idle`. Without it the
            machine hangs entering s0ix. It costs the NPU — see `docs/suspend.md`.
