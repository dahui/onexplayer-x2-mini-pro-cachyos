name: Publish to AUR

# Runs automatically after a successful Release, and never on the tag directly:
# the PKGBUILDs hash the release artifacts, so those must already be uploaded.
#
# The trigger is `workflow_run`, NOT `release: published`. GitHub deliberately
# does not start workflows from events created with GITHUB_TOKEN, so a release
# published by our own release.yml never fires a `release` trigger -- v0.1.0
# proved that by silently doing nothing. `workflow_run` keys off the upstream
# workflow completing instead, which is not subject to that restriction.
#
# Keeping this separate from release.yml means a failed AUR push can be re-run
# on its own without rebuilding the release.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true
      only:
        description: 'Publish a single package (optional)'
        required: false
      dry_run:
        description: 'Do everything except push'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    # Only after a Release that actually succeeded, and only for tag runs --
    # `head_branch` carries the tag name for tag-triggered workflows. A manual
    # dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    # makepkg, updpkgsums and makepkg --printsrcinfo only exist on Arch.
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default. Take the
          # exact commit the Release was built from, so the PKGBUILDs and their
          # local sources match the artifacts being hashed.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Create build user
        # makepkg refuses to run as root, and the container is root by default.
        run: |
          useradd -m builder
          chown -R builder:builder .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set."
            echo "Generate a key, add the public half to your AUR account, and"
            echo "store the private half as a repository secret."
            exit 1
          fi
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          # A key with a missing trailing newline fails with an error that does
          # not mention newlines; normalise rather than debug it later.
          chmod 600 /home/builder/.ssh/aur
          cat > /home/builder/.ssh/config <<-EOF
          Host aur.archlinux.org
            User aur
            IdentityFile /home/builder/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chown -R builder:builder /home/builder/.ssh

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            # The tag that triggered the Release, e.g. v0.1.0
            V="${{ github.event.workflow_run.head_branch }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
          echo "publishing version ${V#v}"

      - name: Publish
        env:
          AUR_USERNAME: ${{ vars.AUR_USERNAME }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL }}
        run: |
          # dry_run and only are set only by a manual dispatch; an automatic run
          # after a release always pushes for real. Written as explicit ifs
          # rather than `[ ] && ...` -- under `bash -e` a false test as the last
          # statement would fail the step, and this is the one path that cannot
          # be rehearsed before a real release.
          ARGS="--version ${{ steps.ver.outputs.version }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          # shellcheck disable=SC2086
          runuser -u builder -- env \
            AUR_USERNAME="$AUR_USERNAME" AUR_EMAIL="$AUR_EMAIL" \
            ./packaging/aur-publish.sh $ARGS
