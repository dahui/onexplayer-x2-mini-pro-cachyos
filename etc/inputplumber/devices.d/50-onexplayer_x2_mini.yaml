# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: ONEXPLAYER X2 Mini

# Only allow a single source device per composite device of this type.
single_source: false

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  - dmi_data:
      product_name: ONEXPLAYER X2Mini PRO
      sys_vendor: ONE-NETBOOK
  - dmi_data:
      product_name: ONEXPLAYER X2Mini
      sys_vendor: ONE-NETBOOK

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
#
# The X2 Mini PRO carries the same system board as the ONEXPLAYER APEX, so this
# block is deliberately identical to 50-onexplayer_apex.yaml. Both firmware
# revisions' USB topologies are listed; only the ones that exist will bind.
# Verified on this unit: the pad and the OXP button controller sit behind the
# built-in 1a86:8091 hub on 0000:65:00.4, matching the APEX "Original Firmware"
# paths exactly.
source_devices:
  # Original Firmware
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:65:00.4-1.3/input0
      handler: event*

  - group: keyboard
    evdev:
      name: "HID 1a86:fe00"
      phys_path: usb-0000:65:00.4-1.2/input0
      handler: event*

  # Updated Firmware
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:c5:00.4-1.3/input0
      handler: event*

  - group: keyboard
    evdev:
      name: "HID 1a86:fe00"
      phys_path: usb-0000:c5:00.4-1.2/input0
      handler: event*

  - group: keyboard
    evdev:
      name: AT Translated Set 2 keyboard
      phys_path: isa0060/serio0/input0
      handler: event*

  - group: gamepad
    hidraw:
      vendor_id: 0x1a86
      product_id: 0xfe00
      interface_num: 2

  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default.
# steamos-manager overrides this with the target_devices list from
# /usr/share/steamos-manager/devices/onexplayer-x2-mini.toml once it sees the
# device on DBus.
target_devices:
  - xbox-elite
  - mouse
  - keyboard

# The ID of a device event mapping in the 'capability_maps' folder.
#
# oxpx2m, not the APEX's oxp8. The chords genuinely are shared between the two
# boards, but oxp8 also expects a Turbo button, an Orange button and paddle
# events that this unit never emits, and it does not know that Home arrives over
# vendor HID here. Every entry in oxpx2m was captured on this machine.
capability_map_id: oxpx2m
